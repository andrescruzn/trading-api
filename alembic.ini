# ======================================================================
# alembic.ini
#
# Configuración de Alembic (migraciones de esquema MySQL).
#
# NOTAS:
# - La URL de conexión NO va aquí: database/migrations/env.py la toma de `settings`
#   (.env) vía app.extensions.db, igual que la app.
# - Comandos en el skill `database` (sección "Migraciones con Alembic").
# ======================================================================

[alembic]
script_location = %(here)s/database/migrations
prepend_sys_path = .

# Nombre de archivo: 20261007_1530_<rev>_<slug>.py → ordenados por fecha
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

timezone = UTC
version_path_separator = os
output_encoding = utf-8

[post_write_hooks]

# ----------------------------------------------------------------------
# Logging (solo para la CLI de Alembic)
# ----------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
