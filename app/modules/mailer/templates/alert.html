{% extends "base.html" %}
{% block content %}
  <h2 style="margin:0 0 12px 0;">{{ title }}</h2>
  {% if message %}
  <p style="margin:0 0 12px 0;">{{ message }}</p>
  {% endif %}
  <p style="color:#666; margin:0 0 8px 0;">
    Regla: <strong>{{ rule_name }}</strong><br>
    Severidad: <strong style="text-transform:uppercase;">{{ severity }}</strong>
  </p>
  {% if payload %}
  <pre style="background:#f5f5f5; padding:10px; border-radius:4px; font-size:12px; color:#333;">{{ payload | tojson(indent=2) }}</pre>
  {% endif %}
{% endblock %}
