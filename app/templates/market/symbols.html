{% extends "base.html" %}

{% block title %}Símbolos de Mercado — Trading AI{% endblock %}

{% block body %}
<div class="page">

  <nav class="nav">
    <a href="/dashboard" class="nav__brand">Trading AI</a>
    <div class="nav__actions">
      <span id="nav-role-badge"></span>
      <a href="/market/candles" class="btn btn--secondary" style="width:auto;padding:0.45rem 1rem;">Ver velas</a>
      <a href="/dashboard" class="btn btn--secondary" style="width:auto;padding:0.45rem 1rem;">Dashboard</a>
    </div>
  </nav>

  <main class="page__body">
    <div class="container container--wide">

      <h1>Símbolos del Mercado</h1>
      <p class="text-muted mt-1">Activos disponibles para operar</p>

      <!-- Filtros -->
      <div style="display:flex;flex-wrap:wrap;gap:0.75rem;margin:1rem 0;">
        <div class="form-group" style="margin:0;min-width:160px;">
          <label for="filter-exchange">Exchange</label>
          <select id="filter-exchange" class="input-select">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;min-width:140px;">
          <label for="filter-asset-class">Clase</label>
          <select id="filter-asset-class" class="input-select">
            <option value="">Todas</option>
            <option value="crypto">Crypto</option>
            <option value="metal">Metal</option>
            <option value="etf">ETF</option>
            <option value="stock">Stock</option>
            <option value="forex">Forex</option>
          </select>
        </div>
        <div style="display:flex;align-items:flex-end;">
          <button class="btn btn--secondary" id="btn-filter" type="button" style="width:auto;padding:0.55rem 1rem;">Filtrar</button>
        </div>
      </div>

      <hr class="divider">

      <div id="alert-msg" class="alert hidden"></div>

      <div id="table-loading" class="text-center mt-3">
        <span class="spinner"></span>
        <p class="text-muted mt-1">Cargando...</p>
      </div>

      <div id="table-wrapper" class="hidden">
        <table class="data-table">
          <thead>
            <tr>
              <th>Símbolo</th>
              <th>Exchange</th>
              <th>Base</th>
              <th>Quote</th>
              <th>Clase</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="symbols-tbody"></tbody>
        </table>
        <div id="pagination" class="pagination hidden">
          <span id="pag-info" class="pagination__info"></span>
          <div class="pagination__btns">
            <button class="btn btn--secondary btn--sm" id="pag-prev" type="button">← Anterior</button>
            <button class="btn btn--secondary btn--sm" id="pag-next" type="button">Siguiente →</button>
          </div>
        </div>
      </div>

    </div>
  </main>

</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/market/symbols.js"></script>
{% endblock %}
